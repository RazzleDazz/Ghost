name: Ghost Agent CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12", "3.14" ]

    steps:
      - name: Checkout RazzleDazz/Ghost
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-timeout

      - name: Run pytest suite with plugin autoload disabled
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -v --timeout=15

      - name: Verify agent CLI, hash-chain, AST scan & SQLite maintenance
        env:
          GHOST_DB_PATH: /tmp/ci_ghost_events.db
          GHOST_LOG_DIR: /tmp/ci_logs
        run: |
          python agent.py
          python agent.py --verify-chain
          python ast_and_db_tools.py
